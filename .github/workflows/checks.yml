name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: clientflow_test
        ports: ['127.0.0.1:3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      APP_ORIGIN: http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/ci-environment.mjs
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:prepare
      - name: Verify isolated MySQL version
        run: node --import tsx scripts/check-test-database.mjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/desktop-overview.png
            test-results/mobile-overview.png
            test-results/desktop-visitor-demo-login.png
            test-results/mobile-visitor-demo-login.png
            test-results/desktop-visitor-demo.png
            test-results/mobile-visitor-demo.png
          if-no-files-found: ignore
